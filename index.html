<!DOCTYPE html>
<!-- Keep in sync with 404.html (`@deot/docs:redirect`). -->
<html>
<head>
	<title>@deot/docs 文档</title>
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<meta charset="UTF-8">
</head>
<body>
	<div id="app"></div>
	<script>
		const repository = 'https://raw.githubusercontent.com/deot/docs/refs/heads/main/';
		const locales = {
			'zh-CN': { label: '简体中文' },
			'en-US': { label: 'English' }
		};
		const packages = [
			{ label: 'index', value: 'index' },
			{ label: 'launch', value: 'launch' },
			{ label: 'client', value: 'client' },
			{ label: 'cli', value: 'cli' },
			{ label: 'dever', value: 'dever' },
			{ label: 'locale', value: 'locale' },
			{ label: 'markdown', value: 'markdown' },
			{ label: 'playground', value: 'playground' },
			{ label: 'renderer', value: 'renderer' },
			{ label: 'theme', value: 'theme' }
		];
		const documents = [
			{ value: 'guide', source: 'README.md', route: '/packages/guide' },
			{ value: 'markdown-sample', source: 'docs/markdown.md', route: '/guide/markdown' },
			...packages.map(item => ({
				value: item.value,
				source: `packages/${item.value}/README.md`,
				route: `/packages/${item.value}`
			}))
		];
		const readmes = Object.fromEntries(documents.map(item => [item.value, item.source]));
		const readmeRoutes = Object.fromEntries(documents.map(item => [item.source, item.route]));
		const localeReadmes = Object.fromEntries(Object.keys(locales).map(lang => [
			lang,
			readmes
		]));
		const sidebars = Object.fromEntries(Object.keys(locales).map(lang => [
			lang,
			[
				{
					label: lang === 'zh-CN' ? '简介' : 'Introduction',
					icon: 'file',
					children: [
						{
							label: lang === 'zh-CN' ? '开始使用' : 'Getting Started',
							value: '/packages/guide'
						},
						{
							label: 'Markdown',
							value: '/guide/markdown'
						}
					]
				},
				{
					label: 'Packages',
					children: packages.map(item => ({
						label: item.label,
						value: `/packages/${item.value}`,
						...(item.value === 'playground' ? { tag: 'v1.1.0' } : {})
					}))
				}
			]
		]));
		const createHomeDocument = (lang) => {
			const t = (zh, en) => (lang === 'zh-CN' ? zh : en);
			const accent = '#873bf4';
			const accentSecondary = '#a78bda';
			const accents = [accent, '#2d8cf0', '#14b8a6'];
			const title = t('一个 HTML，即可部署', 'One HTML file. Ready to deploy.');
			const action = {
				label: t('开始使用', 'Quick Start'),
				to: `/${lang}/packages/guide`,
				variant: 'solid',
				size: 'large',
				color: accent,
				textColor: '#ffffff'
			};
			const stack = {
				marginTop: 0,
				marginBottom: 64,
				paddingTop: 0,
				paddingBottom: 0,
				maxWidth: 1536
			};
			const block = (id, type, props, appearance = stack) => ({
				id,
				module: { type, version: 1, props },
				appearance
			});
			const cards = (items) => items.map((item, index) => ({
				...item,
				icon: item.icon || String(index + 1).padStart(2, '0'),
				accent: item.accent || accents[index]
			}));

			// 示例中的 @ 使用 Unicode 转义，避免本地预览改写展示用的 CDN 入口。
			const deploymentExample = [
				'<!DOCTYPE html>',
				'<html>',
				'<head>',
				'\t<meta charset="UTF-8">',
				'\t<meta name="viewport" content="width=device-width,initial-scale=1">',
				'\t<title>My Docs</title>',
				'</head>',
				'<body>',
				'\t<div id="app"></div>',
				'',
				'\t<script>',
				'\t\twindow.$docs = {',
				'\t\t\tnamespace: \'my-docs\',',
				'\t\t\tlocales: {',
				'\t\t\t\t\'zh-CN\': { label: \'简体中文\' },',
				'\t\t\t\t\'en-US\': { label: \'English\' }',
				'\t\t\t},',
				'\t\t\troutes: {',
				'\t\t\t\t\'/guide/:name\': {',
				'\t\t\t\t\tvalue: to => `guide/${to.params.name}`,',
				'\t\t\t\t\tcontent: \'default\',',
				'\t\t\t\t\tsidebar: \'./sidebar.json\',',
				'\t\t\t\t\theader: \'default\',',
				'\t\t\t\t\tfooter: \'default\',',
				'\t\t\t\t\textra: null',
				'\t\t\t\t},',
				'\t\t\t\t\'*\': \'/guide/installation\'',
				'\t\t\t},',
				'\t\t\tresolve: {',
				'\t\t\t\tmarkdown: ({ value }) => `./${value}.md`',
				'\t\t\t},',
				'\t\t\ttheme: { default: \'system\' },',
				'\t\t\tprefetch: {',
				'\t\t\t\tbatchSize: 2,',
				'\t\t\t\tidleTimeout: 1500',
				'\t\t\t},',
				'\t\t\tmodules: {},',
				'\t\t\tstyles: {}',
				'\t\t};',
				'\t<\/script>',
				'\t<script type="module" src="https://cdn.jsdelivr.net/npm/\u0040deot/docs-launch/+esm"><\/script>',
				'</body>',
				'</html>'
			].join('\n');

			return {
				schemaVersion: 2,
				meta: { id: `docs-home-${lang}`, title },
				layout: {
					mode: 'sortable',
					maxWidth: 1920,
					minHeight: 600,
					contentWidth: 1536,
					sidePattern: true,
					background: '#ffffff'
				},
				blocks: [
					block('home-hero', 'hero', {
						eyebrow: '@deot/docs',
						title,
						description: t(
							'把站点配置与 CDN 入口写进 HTML，接入你的 Markdown，直接发布。',
							'Put your site configuration and CDN entry in one HTML file. Add Markdown and publish.'
						),
						align: 'left',
						accent,
						accentSecondary,
						background: '',
						showVisual: true,
						visual: {
							type: 'code',
							title: t('index.html · 核心入口摘录', 'index.html · Core excerpt'),
							language: 'html',
							content: [
								'<div id="app"></div>',
								'<script>',
								'window.$docs = {',
								'  namespace: \'my-docs\',',
								'  // ' + t('语言、路由与资源配置', 'Locale, route and resource settings'),
								'};',
								'<\/script>',
								'<script type="module"',
								'  src="https://cdn.jsdelivr.net/npm/\u0040deot/docs-launch/+esm"><\/script>'
							].join('\n')
						},
						minHeight: 520,
						highlights: [
							{ value: t('静态', 'Static'), label: t('直接部署', 'Direct deploy') },
							{ value: t('实时', 'Live'), label: t('资源热更新', 'Hot resources') },
							{ value: 'i18n', label: t('多语言内置', 'Built-in locales') }
						],
						actions: [action]
					}, { ...stack, marginBottom: 40, fullWidth: true, maxWidth: 1536 }),

					block('home-features', 'features', {
						eyebrow: t('能力', 'Capabilities'),
						title: t('从写作到发布，一次齐备', 'Everything from writing to shipping'),
						description: t(
							'把部署、资源更新和缓存管理交给工具链，专注内容本身。',
							'Let the toolchain handle deployment, updates and caching. Focus on your content.'
						),
						align: 'center',
						accent,
						columns: 3,
						gap: 24,
						items: cards([
							{
								title: t('静态部署', 'Static deployment'),
								description: t(
									'构建为静态站点，直接部署到现有托管平台。',
									'Build a static site and deploy it to your existing hosting platform.'
								),
								badge: t('交付', 'Ship'),
								icon: 'upload'
							},
							{
								title: t('实时预览', 'Live preview'),
								description: t(
									'修改 Markdown 和页面资源，开发时即时查看更新。',
									'Edit Markdown and page resources, then see updates as you work.'
								),
								badge: t('同步', 'Live'),
								icon: 'again'
							},
							{
								title: t('资源管理', 'Resource management'),
								description: t(
									'统一处理缓存、预加载与离线回退，让阅读更连贯。',
									'Keep reading smooth with caching, prefetching and offline fallback.'
								),
								badge: t('网关', 'Gateway'),
								icon: 'link'
							}
						])
					}),

					block('home-code', 'code', {
						eyebrow: t('示例', 'Example'),
						title: t('从这份配置开始', 'Start with this configuration'),
						description: t(
							'复制完整入口文件，接入你的文档内容与路由。\n按需调整语言、主题和资源解析。',
							'Copy the complete entry file and connect your documents and routes.\nCustomize locales, the theme and resource resolution as needed.'
						),
						align: 'center',
						filename: 'index.html',
						language: 'html',
						content: deploymentExample,
						accent: '',
						background: '',
						textColor: '',
						folds: [
							{ start: 3, end: 7, label: t('页面基础信息', 'Page metadata') },
							{ start: 14, end: 38, label: t('语言、路由与资源配置', 'Locale, route and resource settings') }
						],
						highlightLines: [12, 41]
					}),

					block('home-steps', 'steps', {
						eyebrow: t('上手', 'Start'),
						title: t('三步开始一份文档', 'Three steps to a live page'),
						description: t(
							'写作、预览、发布，每一步都在熟悉的工作流里。',
							'Write, preview and publish in one familiar workflow.'
						),
						align: 'center',
						accent,
						columns: 3,
						items: cards([
							{
								title: t('编写', 'Write'),
								description: t(
									'用 Markdown 编写内容，按需组合页面模块。',
									'Write Markdown and add page modules where you need them.'
								)
							},
							{
								title: t('预览', 'Preview'),
								description: t(
									'启动本地预览，在更新中检查内容和排版。',
									'Preview locally and check your content and layout as they change.'
								)
							},
							{
								title: t('发布', 'Ship'),
								description: t(
									'构建静态 workspace，部署到熟悉的托管平台。',
									'Build a static workspace and deploy it to your preferred host.'
								)
							}
						])
					}),

					block('home-faq', 'faq', {
						eyebrow: t('问答', 'FAQ'),
						title: t('常见问题', 'Questions we hear first'),
						description: t(
							'关于部署、更新和页面定制，你可能还想了解这些。',
							'A few details about deployment, updates and customization.'
						),
						align: 'center',
						accent,
						items: [
							{
								question: t('需要单独的文档服务吗？', 'Do I need a dedicated documentation server?'),
								answer: t(
									'不需要。构建结果是静态站点，可以放到任意静态托管。',
									'No. The build output is a static site you can host anywhere.'
								)
							},
							{
								question: t('更新文档必须重新部署吗？', 'Do updates require a full redeploy?'),
								answer: t(
									'开发模式支持资源热更新；生产环境按你的发布流程替换静态文件即可。',
									'Development supports live resource updates; production replaces static files with your usual release flow.'
								)
							},
							{
								question: t('可以自定义首页吗？', 'Can I customize the home page?'),
								answer: t(
									'可以。首页是一份可装修的页面文档，也可以换成站点自己的 page.json。',
									'Yes. Home is an editable page document, or you can point it at your own page.json.'
								)
							}
						]
					}),

					block('home-cta', 'cta', {
						eyebrow: t('下一步', 'Next'),
						title: t('让下一份文档，从这里开始', 'Your next document starts here'),
						description: t(
							'从一份 Markdown 开始，按需要补齐页面与模块。',
							'Start with Markdown, then add pages and modules as you need them.'
						),
						align: 'center',
						accent,
						accentSecondary,
						background: '',
						actions: [action]
					}, { ...stack, marginBottom: 0, fullWidth: true, maxWidth: 1536 })
				]
			};
		};
		const logo = `data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#873bf4"/><path fill="#fff" fill-rule="evenodd" d="M18 13h12c10.5 0 19 8.5 19 19s-8.5 19-19 19H18V13zm12 9v20h1.5c5.8 0 10.5-4.5 10.5-10S37.3 22 31.5 22H30z"/></svg>')}`;
		window.$docs = {
			namespace: '@deot/docs-site',
			repository: 'https://github.com/deot/docs',
			theme: { default: 'system' },
			layout: {
				header: {
					brand: {
						logo,
						label: '@deot/docs',
						value: '/'
					}
				}
			},
			locales,
			routes: Object.fromEntries([
				['/', {
					content: {
						'zh-CN': createHomeDocument('zh-CN'),
						'en-US': createHomeDocument('en-US')
					}
				}],
				...documents.map(item => [item.route, {
					value: item.value,
					content: 'default',
					sidebar: sidebars,
					header: 'default',
					footer: 'default',
					extra: null
				}]),
				['*', '/packages/guide']
			]),
			resolve: {
				// 两种语言暂时共用仓库内的 Markdown，后续可只替换对应语言的映射。
				markdown: ({ lang, value }) => (
					localeReadmes[lang] || localeReadmes['en-US']
				)[value],
				resource: ({ source, type, lang, runtime }) => {
					if (source === 'README.md') {
						return runtime.mode === 'development'
							? '/README.md'
							: new URL(source, repository).href;
					}
					if (/^packages\/[^/]+\/README\.md$/.test(source)) {
						return runtime.mode === 'development'
							? `/${source}`
							: new URL(source, repository).href;
					}
					if (/^docs\/[^/]+\.md$/.test(source)) {
						return runtime.mode === 'development'
							? `/${source}`
							: new URL(source, repository).href;
					}
					// 未接管的 Page、JSON、SFC 等继续使用 Client 的统一默认寻址。
					return undefined;
				},
				link: ({ href, lang, source }) => {
					const logicalOrigin = 'https://docs.local';
					let target;
					try {
						target = new URL(href, new URL(source, `${logicalOrigin}/`));
					} catch {
						return;
					}
					if (target.origin !== logicalOrigin) return;
					const route = readmeRoutes[target.pathname.replace(/^\//, '')];
					return route
						? `/${lang}${route}${target.search}${target.hash}`
						: undefined;
				}
			},
			modules: window.__DOCS_RUNTIME__?.mode !== 'development'
				? {}
				: {
					'@deot/docs-locale': '/__docs/module/@deot/docs-locale',
					'@deot/docs-markdown': '/__docs/module/@deot/docs-markdown',
					'@deot/docs-playground': '/__docs/module/@deot/docs-playground',
					'@deot/docs-renderer': '/__docs/module/@deot/docs-renderer',
					'@deot/docs-theme': '/__docs/module/@deot/docs-theme'
				}
		}
	</script>
	<script>
		const entries = [
			'https://cdn.jsdelivr.net/npm/@deot/docs-launch/+esm',
			'https://esm.unpkg.com/@deot/docs-launch/dist/index.js'
		];
		const controller = new AbortController();
		const timer = setTimeout(() => controller.abort(), 15000);
		const fail = () => {
			document.querySelector('#app').textContent = '文档入口加载失败，请刷新重试。';
		};
		Promise.any(entries.map(async (src) => {
			const response = await fetch(src, { signal: controller.signal });
			if (!response.ok || !/(?:java|ecma)script/i.test(response.headers.get('content-type'))) {
				throw new Error(`Invalid launch response: ${src}`);
			}
			return { cdn: src.match(/^https?:.*?(?=@deot\/docs-launch)/)?.[0], source: await response.text() };
		})).finally(() => {
			clearTimeout(timer);
			controller.abort();
		}).then(({ cdn, source }) => {
			window.$docs.runtime = { mode: 'production', ...window.$docs.runtime, cdn };
			document.body.appendChild(Object.assign(document.createElement('script'), { type: 'module', textContent: source, onerror: fail }));
		}).catch(fail);
	</script>
</body>
</html>
