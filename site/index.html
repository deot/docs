<!DOCTYPE html>
<html>
<head>
	<title>@deot/docs 文档</title>
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<meta charset="UTF-8">
</head>
<body>
	<div id="app">%BASE_URL%</div>
	<script>
		window.$docs = {
			locales: {
				'zh-CN': '简体中文',
				'en-US': 'English'
			},
			routes: {
				'/': '/index',
				'/index': {
					default: '',
					sidebar: null,
					header: 'default',
					footer: 'default',
					extra: null,
				},
				'/components/:name': {
					default: 'default',
					sidebar: {
						type: 'json',
						path: './sidebar.json'
					},
					header: 'default',
					footer: 'default',
					extra: null,
				},
				'/api/:name': {
					default: 'default',
					sidebar: {
						type: 'json',
						path: './sidebar.json'
					},
					header: 'default',
					footer: 'default',
					extra: null,
				},
				'*': (to) => {
					return '/zh-CN/index';
				}
			}
		}
	</script>
	<script type="module" src="./packages/client/src/index.ts"></script>
</body>
</html>
